name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build relay + agent
        run: go build ./cmd/hub ./cmd/agent
      - name: Unit tests
        run: go test ./internal/... -count=1

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: Vet
        run: go vet .
      - name: Build GUI (no bundle)
        run: go build ./...

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check plugin
        run: node --check plugin/client.mjs
      - name: Syntax check panel bundle
        run: node --check extension/panel/main.js
